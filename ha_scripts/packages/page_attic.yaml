#-------------------------------------------
# Example page
#
# One LVGL page with two room tiles ("Workspace" / "Bedroom"), each with a
# light button, a heater button, roller-shutter up/stop/close buttons and a
# shutter-position bar.
#
# This is a DEMO: every button's on_click only writes a log line. Wire the
# buttons to Home Assistant yourself (e.g. `homeassistant.action:` /
# `homeassistant.service:`) and add `homeassistant` sensors to reflect real
# state. The project is primarily about the mechanical build - this page just
# shows that the display, touch, theming, dimming and offline handling work.
#-------------------------------------------

substitutions:
  page_attic_id: page_attic_id
  page_attic_friendly_name: "Attic"

lvgl:
  #  page_wrap: true
  pages:
    - id: $page_attic_id
      x: 0
      y: 0
      skip: false
      layout: # header row + one flexible content row + a small bottom margin
        type: grid
        grid_columns: [10px, fr(1), 10px, fr(1), 10px]
        grid_rows: [75px, fr(1), 10px]
        pad_column: 0px
        pad_row: 0px
      width: 100%
      bg_color: bg_color
      bg_opa: cover
      widgets:
        #-------------------------------------------
        # Tile: Workspace
        #-------------------------------------------
        - obj:
            grid_cell_row_pos: 1
            grid_cell_column_pos: 1
            grid_cell_y_align: STRETCH
            grid_cell_x_align: STRETCH

            styles: style_box
            radius: 5
            pad_all: 10px

            layout:
              type: grid
              grid_columns: [fr(1), 20px, fr(1)]
              grid_rows: [50px, fr(1), fr(1), fr(1)]
              pad_column: 10px
              pad_row: 10px
            widgets:
              - label:
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_column_span: 3
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_workspace_header
                  text_font: $text_font_large
                  text: Workspace
                  long_mode: WRAP
                  height: SIZE_CONTENT

              - button:
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  pad_all: 0px
                  id: button_light_workspace_id
                  widgets:
                    - obj:
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        align: CENTER
                        event_bubble: TRUE # pass on events to parent
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER
                          pad_row: $pad_button_icon_text
                        pad_all: 0px
                        widgets:
                          - label:
                              event_bubble: TRUE # pass on events to parent
                              text_font: $icon_font
                              text: $lamp
                              id: button_light_workspace_icon_id
                          - label:
                              event_bubble: TRUE # pass on events to parent
                              id: button_light_workspace_label_id
                              text: "Light"
                  on_click:
                    then:
                      - lambda: 'ESP_LOGI("${TAG}", "button_light_workspace_id clicked");'

              - button:
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  pad_all: 0px
                  id: button_heater_workspace_id
                  widgets:
                    - obj:
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        align: CENTER
                        event_bubble: TRUE # pass on events to parent
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER
                          pad_row: $pad_button_icon_text
                        pad_all: 0px
                        widgets:
                          - label:
                              event_bubble: TRUE # pass on events to parent
                              text_font: $icon_font
                              text: $radiator
                              id: button_heater_workspace_icon_id
                          - label:
                              event_bubble: TRUE # pass on events to parent
                              id: button_heater_workspace_label_id
                              text: "Heater"
                  on_click:
                    then:
                      - lambda: 'ESP_LOGI("${TAG}", "button_heater_workspace_id clicked");'

              - bar:
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  grid_cell_row_span: 3
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH

                  id: bar_rollershutter_pos_workspace_id
                  height: 30
                  value: 75
                  min_value: 0
                  max_value: 100

                  mode: RANGE
                  radius: 13
                  border_width: 2
                  pad_all: 0
                  bg_color: $bg_color
                  border_color: $button_bg_unchecked

                  indicator:
                    radius: 3

              - button:
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  pad_all: 0px
                  id: button_rollershutter_workspace_open_id
                  widgets:
                    - obj:
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        align: CENTER
                        event_bubble: TRUE # pass on events to parent
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER
                          pad_row: $pad_button_icon_text
                        pad_all: 0px
                        widgets:
                          - label:
                              event_bubble: TRUE # pass on events to parent
                              text_font: $icon_font
                              text: $up
                              id: button_rollershutter_workspace_open_icon_id
                          - label:
                              event_bubble: TRUE # pass on events to parent
                              id: button_rollershutter_workspace_open_label_id
                              text: "Open"
                  on_click:
                    then:
                      - lambda: 'ESP_LOGI("${TAG}", "button_rollershutter_workspace_open_id clicked");'

              - button:
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  pad_all: 0px
                  id: button_rollershutter_workspace_stop_id
                  widgets:
                    - obj:
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        align: CENTER
                        event_bubble: TRUE # pass on events to parent
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER
                          pad_row: $pad_button_icon_text
                        pad_all: 0px
                        widgets:
                          - label:
                              event_bubble: TRUE # pass on events to parent
                              text_font: $icon_font
                              text: $stop
                              id: button_rollershutter_workspace_stop_icon_id
                          - label:
                              event_bubble: TRUE # pass on events to parent
                              id: button_rollershutter_workspace_stop_label_id
                              text: "Stop"
                  on_click:
                    then:
                      - lambda: 'ESP_LOGI("${TAG}", "button_rollershutter_workspace_stop_id clicked");'

              - button:
                  grid_cell_row_pos: 3
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  pad_all: 0px
                  id: button_rollershutter_workspace_close_id
                  widgets:
                    - obj:
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        align: CENTER
                        event_bubble: TRUE # pass on events to parent
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER
                          pad_row: $pad_button_icon_text
                        pad_all: 0px
                        widgets:
                          - label:
                              event_bubble: TRUE # pass on events to parent
                              text_font: $icon_font
                              text: $down
                              id: button_rollershutter_workspace_close_icon_id
                          - label:
                              event_bubble: TRUE # pass on events to parent
                              id: button_rollershutter_workspace_close_label_id
                              text: "Close"
                  on_click:
                    then:
                      - lambda: 'ESP_LOGI("${TAG}", "button_rollershutter_workspace_close_id clicked");'

        #-------------------------------------------
        # Tile: Bedroom
        #-------------------------------------------

---
#-------------------------------------------
# Display Terminal Device Configuration
# ESP32-S3 based touchscreen display terminal
#-------------------------------------------

substitutions:
  touchscreen_id: my_touchscreen # Touchscreen component ID

#-------------------------------------------
# ESP32-S3 Hardware Configuration
# Optimized for 16MB flash with PSRAM
#-------------------------------------------
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y # Optimize for size
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y # Run at 240MHz
      CONFIG_ESP32S3_DATA_CACHE_64KB: y # 64KB data cache
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y # 64-byte cache lines
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y # Execute code from PSRAM
      CONFIG_SPIRAM_RODATA: y # Store read-only data in PSRAM

#-------------------------------------------
# PSRAM Configuration
# External RAM for graphics buffers
# See: https://esphome.io/components/psram.html
#-------------------------------------------
psram:
  mode: octal # Octal SPI mode for higher bandwidth
  speed: 80MHz # 80MHz clock speed

#-------------------------------------------
# Logging Configuration
#-------------------------------------------
logger:
  level: info
  logs:
    i2c.idf: info # I2C driver messages
    touchscreen: info # Touch events
    scheduler: none # Suppress scheduler logs

#-------------------------------------------
# System Configuration
#-------------------------------------------

# Home Assistant API with encryption
api:
  encryption:
    key: ${api_key}

# Over-The-Air updates
ota:
  - platform: esphome
    password: ${ota_pw}

#-------------------------------------------
# WiFi Configuration
#-------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback access point if WiFi fails
  ap:
    ssid: ${fallback_hotspot_ssid}
    password: ${fallback_hotspot_pw}

#-------------------------------------------
# Network Provisioning
#-------------------------------------------

# Captive portal for WiFi setup via AP mode
captive_portal:

# Dashboard import for easy updates
dashboard_import:
  package_import_url: github://esphome/example-configs/esphome-web/esp32.yaml@main

#-------------------------------------------
# Web Server
# Provides web interface for device management
#-------------------------------------------
web_server:
  port: 80
  version: 3

#-------------------------------------------
# Time Synchronization
# SNTP client for accurate timekeeping
#-------------------------------------------
time:
  - platform: sntp
    id: clock_timer
    timezone: Europe/Berlin
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    # Update the header clock minute-aligned (on_time) and right after the NTP
    # sync. time_update is defined in statusbar.yaml (always loaded together
    # with device_basics) and only runs on a valid time.
    on_time_sync:
      then:
        - script.execute: time_update
    on_time:
      - seconds: 0
        then:
          - script.execute: time_update

#-------------------------------------------
# Hardware Outputs
# Physical actuators controlled by the ESP32
# (Internal definitions, not exposed to Home Assistant)
#-------------------------------------------
output:
  # Display backlight PWM control
  - platform: ledc
    pin: GPIO38
    id: backlight_output
    frequency: 100Hz

  # Built-in 240V relay
  - id: panel_output
    platform: gpio
    pin: 40

#-------------------------------------------
# Lights
# Actuators exposed to Home Assistant
#-------------------------------------------
light:
  ## Expose internal relay as light
  - platform: binary
    name: "Panel Switch"
    id: panel_switch
    output: panel_output

#-------------------------------------------
# I2C Bus Configuration
# Used for GT911 touchscreen controller
#-------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO19
    # WARNING: GPIO45 is a strapping pin on ESP32-S3 and should be used with care.
    # External pull-up/down resistors can cause unexpected boot failures.
    # Consider using a different SCL pin if possible.
    # See: https://esphome.io/guides/faq.html#why-am-i-getting-a-warning-about-strapping-pins
    scl:
      number: GPIO45
      ignore_strapping_warning: true

#-------------------------------------------
# Touchscreen Configuration
# GT911 capacitive touch controller
#-------------------------------------------
touchscreen:
  platform: gt911
  transform:
    mirror_x: false
    mirror_y: false
  id: $touchscreen_id
  on_touch:
    # ESP_LOGI instead of logger.log: - the latter often does not reach the
    # ESP-IDF console, depending on log routing/level.
    - lambda: |-
        ESP_LOGI("${TAG}", "Touch at x=%d, y=%d (raw x=%d, y=%d)",
            touch.x,
            touch.y,
            touch.x_raw,
            touch.y_raw
            );

#-------------------------------------------
# Display Configuration
# ST7701S 480x480 RGB TFT LCD panel
#-------------------------------------------
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

display:
  - platform: st7701s
    update_interval: never # Manual updates only via LVGL
    auto_clear_enabled: False # LVGL handles clearing
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    dimensions:
      width: 480
      height: 480
    # Pin assignments
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: False
    # Timing parameters
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    # Display initialization sequence
    init_sequence:
      - 1
      # Custom initialization commands (command byte followed by data bytes)
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # disable MDT flag
    # RGB data pin assignments (5-6-5 bit layout)
    data_pins:
      red:
        - 11 #r1
        - 12 #r2
        - 13 #r3
        - 14 #r4
        - 0 #r5
      green:
        - 8 #g0
        - number: 20 #g1
        - 3 #g2
        - 46 #g3
        - 9 #g4
        - 10 #g5
      blue:
        - 4 #b1
        - 5 #b2
        - 6 #b3
        - 7 #b4
        - 15 #b5

#-------------------------------------------
# LVGL Graphics Library Configuration
# Manages UI rendering and touch input
#-------------------------------------------
lvgl:
  touchscreens:
    - touchscreen_id: $touchscreen_id

                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  pad_all: 0px
                  scrollable: false
                  scrollbar_mode: "OFF"
                  widgets:
                    - obj:
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        align: CENTER
                        event_bubble: true
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER
                          pad_row: -8 # icon and label closer together
                        widgets:
                          - label:
                              event_bubble: true
                              text_font: $f_icon
                              text: $up
                          - label:
                              event_bubble: true
                              text: "Up"
                  on_click:
                    # DEMO: wire this to Home Assistant, e.g.
                    #   - homeassistant.action:
                    #       action: cover.open_cover
                    #       data:
                    #         entity_id: cover.your_shutter
                    - lambda: 'ESP_LOGI("${TAG}", "office shutter: up");'
              - button:
                  id: button_shutter_office_stop_id
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH

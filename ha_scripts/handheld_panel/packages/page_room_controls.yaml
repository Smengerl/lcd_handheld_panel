                                flex_align_cross: CENTER
                                pad_column: 6
                              widgets:
                                - label:
                                    event_bubble: true
                                    text_font: $f_icon
                                    text: $radiator
                                - label:
                                    id: label_heater_office_id
                                    event_bubble: true
                                    text: "Off"
                        on_click:
                          # DEMO: toggles locally. With Home Assistant, call e.g.
                          # switch.toggle here and set checked/label from a
                          # homeassistant text_sensor of that switch instead.
                          - lambda: |-
                              bool on = !lv_obj_has_state(button_heater_office_id, LV_STATE_CHECKED);
                              if (on) lv_obj_add_state(button_heater_office_id, LV_STATE_CHECKED);
                              else lv_obj_clear_state(button_heater_office_id, LV_STATE_CHECKED);
                              lv_label_set_text(label_heater_office_id, on ? "On" : "Off");
                              ESP_LOGI("${TAG}", "office heater: %s", on ? "on" : "off");

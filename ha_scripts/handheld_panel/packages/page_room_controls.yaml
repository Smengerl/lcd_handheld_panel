                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER
                          pad_row: -8 # icon and label closer together
                        widgets:
                          - label:
                              event_bubble: true
                              text_font: $f_icon
                              text: $stop
                          - label:
                              event_bubble: true
                              text: "Stop"
                  on_click:
                    # DEMO: wire this to Home Assistant, e.g.
                    #   - homeassistant.action:
                    #       action: cover.stop_cover
                    #       data:
                    #         entity_id: cover.your_shutter
                    - lambda: 'ESP_LOGI("${TAG}", "office shutter: stop");'
              - button:
                  id: button_shutter_office_down_id
                  grid_cell_row_pos: 3
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  pad_all: 0px
                  scrollable: false
                  scrollbar_mode: "OFF"
                  state:
                    disabled: true
                  widgets:
                    - obj:
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        align: CENTER
                        event_bubble: true
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER
                          pad_row: -8 # icon and label closer together
                        widgets:
                          - label:
                              event_bubble: true
                              text_font: $f_icon
                              text: $down
                          - label:
                              event_bubble: true
                              text: "Down"
                  on_click:
                    # DEMO: wire this to Home Assistant, e.g.
                    #   - homeassistant.action:
                    #       action: cover.close_cover
                    #       data:
                    #         entity_id: cover.your_shutter
                    - lambda: 'ESP_LOGI("${TAG}", "office shutter: down");'

              # window: closed share of the shutter from the top (RANGE position..100,
              # Home Assistant reports 100 = open). DEMO: fully closed.
              - bar:
                  id: bar_shutter_office_id
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  grid_cell_row_span: 3
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  min_value: 0
                  max_value: 100
                  start_value: 0
                  value: 100
                  mode: RANGE
                  border_width: ${bw}
                  border_color: ${c_accent}
                  bg_color: ${c_bg}
                  pad_all: 0

              # switches
              - obj:
                  grid_cell_row_pos: 4
                  grid_cell_column_pos: 0
                  grid_cell_column_span: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    pad_column: ${sp_gap}px
                  widgets:
                    - button:
                        id: button_light_office_id
                        flex_grow: 1
                        height: 100%
                        pad_all: 0px
                        scrollable: false
                        scrollbar_mode: "OFF"
                        widgets:
                          - obj:
                              width: SIZE_CONTENT
                              height: SIZE_CONTENT
                              align: CENTER
                              event_bubble: true
                              scrollable: false
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_cross: CENTER
                                pad_column: 6
                              widgets:
                                - label:
                                    event_bubble: true
                                    text_font: $f_icon
                                    text: $lamp
                                - label:
                                    id: label_light_office_id
                                    event_bubble: true
                                    text: "Off"
                        on_click:
                          # DEMO: toggles locally. With Home Assistant, call e.g.
                          # switch.toggle here and set checked/label from a
                          # homeassistant text_sensor of that switch instead.
                          - lambda: |-
                              bool on = !lv_obj_has_state(button_light_office_id, LV_STATE_CHECKED);
                              if (on) lv_obj_add_state(button_light_office_id, LV_STATE_CHECKED);
                              else lv_obj_clear_state(button_light_office_id, LV_STATE_CHECKED);
                              lv_label_set_text(label_light_office_id, on ? "On" : "Off");
                              ESP_LOGI("${TAG}", "office light: %s", on ? "on" : "off");
                    - button:
                        id: button_heater_office_id
                        flex_grow: 1

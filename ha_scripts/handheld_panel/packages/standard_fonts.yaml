          $solar_power_variant,
          $car_electric,
          $printer_3d,
          $attic,
          $wifi,
        ]

 
  # http://materialdesignicons.com/cdn/7.4.47/
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: $weather_font
    size: 60
    bpp: 4
    glyphs: [
      $warning,
      
      $cloudy,
      $cloudyalert,
      $fog,
      $hail,
      $lightning,
      $lightningrainy,
      $night,
      $partlycloudy,
      $partlysnowyrainy,
      $pouring,
      $rainy,
      $snowy,

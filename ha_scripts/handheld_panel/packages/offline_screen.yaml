---
#-------------------------------------------
# Offline Screen Configuration
# Displays an overlay when Home Assistant connection is lost
#-------------------------------------------

substitutions:
  offline_image_path: "handheld_panel/images/offline.png" # Path to offline indicator image

#-------------------------------------------
# Color Definitions
#-------------------------------------------
color:
  - id: offline_screen_bg_color # Black background for offline screen
    red: 0
    green: 0
    blue: 0

#-------------------------------------------
# LVGL Top Layer Widgets
# Overlay screen shown when disconnected from Home Assistant
#-------------------------------------------
lvgl:
  top_layer:
    widgets:
      # Full-screen overlay for offline state
      - obj:
          id: offline_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: offline_screen_bg_color
          bg_opa: COVER # Fully opaque background
          radius: 0 # No rounded corners
          pad_all: 0 # No padding
          border_width: 0 # No border
          layout:
            type: grid
            grid_columns: [fr(1)] # Single column
            grid_rows: [fr(1)] # Single row
          widgets:
            # Centered offline image
            - image:
                grid_cell_row_pos: 0
                grid_cell_column_pos: 0
                grid_cell_x_align: CENTER
                grid_cell_y_align: CENTER
                src: offline_image
#              y: -100

#-------------------------------------------
# API Event Handlers
# Show/hide offline screen based on Home Assistant connection
#-------------------------------------------
api:
  # Hide offline screen when Home Assistant connects
  on_client_connected:
    - lambda: 'ESP_LOGI("${TAG}", "HA connected");'
    - lvgl.widget.hide: offline_screen

  # Show offline screen only when Home Assistant is really gone. This trigger
  # fires for EVERY API client that disconnects - also transient ones like an
  # ESPHome log stream / dashboard - which used to blank the screen although HA
  # was still connected. state_subscription_only: true counts only clients that
  # subscribe to states (HA does, log viewers don't). The 2 s pause lets the
  # disconnecting client drop out of the client list first and lets HA reconnect
  # after a short WiFi/API blip without flashing the overlay.
  on_client_disconnected:
    - lambda: 'ESP_LOGI("${TAG}", "API client disconnected");'
    - delay: 2s
    - if:
        condition:
          not:
            api.connected:
              state_subscription_only: true
        then:
          - lambda: 'ESP_LOGI("${TAG}", "HA gone -> show offline overlay");'
          - lvgl.widget.show: offline_screen

esphome:
  on_boot:
    priority: -50
    then:
      # Give LVGL / network / API a short moment to initialize after flash/boot
      - delay: 5s
      - if:
          condition: api.connected
          then:
            - lambda: 'ESP_LOGD("${TAG}", "Boot: HA connected -> hide offline overlay");'
            - lvgl.widget.hide: offline_screen
          else:
            - lambda: 'ESP_LOGD("${TAG}", "Boot: HA not connected -> show offline overlay");'
            - lvgl.widget.show: offline_screen

#-------------------------------------------
# Image Resources
# NOTE: migrated to the new image: platform format (platform: file)
#-------------------------------------------
image:
  - platform: file
    file: $offline_image_path
    id: offline_image
    type: RGB565 # 16-bit color format for display
    transparency: alpha_channel # Support transparency
#    resize: 150x150
